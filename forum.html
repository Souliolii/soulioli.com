<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soulioli Forum</title>
    <link rel="stylesheet" href="/landing.css" />
    <link rel="stylesheet" href="/forum.css" />
  </head>
  <body>
    <div class="page forum-shell">
      <header class="forum-header">
        <div class="header-left">
          <p class="eyebrow">Soulioli Forum</p>
          <h1>Topics, then posts.</h1>
          <p>Open a topic to read the full thread.</p>
        </div>
        <a class="home-link" href="/" aria-label="Home">Home</a>
      </header>

      <section class="forum-hero">
        <div>
          <p class="forum-label">Public index</p>
          <h2>Browse topics</h2>
        </div>
        <div class="forum-search-panel">
          <input id="forum-search" type="text" placeholder="Search topics by title, tag, or excerpt..." />
        </div>
      </section>

      <section class="topic-index">
        <div class="topic-index-meta">
          <span id="topic-count">0 topics</span>
          <span>Click a topic to open it.</span>
        </div>
        <div id="topic-list" class="topic-list"></div>
      </section>
    </div>
    <script>
      (function () {
        const forumSearch = document.querySelector('#forum-search');
        const topicList = document.querySelector('#topic-list');
        const topicCount = document.querySelector('#topic-count');
        let allTopics = [];

        const escapeHtml = (value) => String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');

        const formatDate = (value) => new Date(value).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

        const renderTopic = (topic, index) => {
          const tags = (topic.tags || []).slice(0, 4).map((tag) => `<span class="topic-tag">${escapeHtml(tag)}</span>`).join('');
          return `
            <a class="topic-card" href="/forum/topic/${encodeURIComponent(topic.id)}">
              <div class="topic-card-number">${String(index + 1).padStart(2, '0')}</div>
              <div class="topic-card-body">
                <div class="topic-card-topline">
                  <span>${topic.replyCount || 0} replies</span>
                  <span>${formatDate(topic.updatedAt || topic.createdAt)}</span>
                </div>
                <h3>${escapeHtml(topic.title)}</h3>
                <p>${escapeHtml(topic.excerpt || 'No preview available.')}</p>
                <div class="topic-mini-meta">${escapeHtml(topic.latestPostTitle || 'Opening post')}</div>
                <div class="topic-tag-row">${tags}</div>
              </div>
            </a>
          `;
        };

        const renderTopics = (topics) => {
          topicCount.textContent = `${topics.length} topic${topics.length === 1 ? '' : 's'}`;
          if (!topics.length) {
            topicList.innerHTML = '<div class="empty-state">No topics found.</div>';
            return;
          }
          topicList.innerHTML = topics.map(renderTopic).join('');
        };

        const loadTopics = async () => {
          const response = await fetch('/api/forum');
          if (!response.ok) throw new Error('Unable to load topics.');
          const data = await response.json();
          allTopics = Array.isArray(data.threads) ? data.threads : [];
          renderTopics(allTopics);
        };

        if (!forumSearch || !topicList || !topicCount) return;

        forumSearch.addEventListener('input', () => {
          const query = forumSearch.value.toLowerCase().trim();
          if (!query) return renderTopics(allTopics);
          const filtered = allTopics.filter((topic) => [topic.title, topic.excerpt, topic.latestPostTitle, ...(topic.postTitles || []), ...(topic.tags || [])].join(' ').toLowerCase().includes(query));
          renderTopics(filtered);
        });

        loadTopics().catch((error) => {
          topicList.innerHTML = `<div class="error-state">${escapeHtml(error.message)}</div>`;
        });
      }());
    </script>
  </body>
</html>
